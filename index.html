    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            overscroll-behavior-y: none; /* Disable pull-to-refresh */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none; /* Disable long-press context menu */
            user-select: none; /* Disable text selection */
            -webkit-user-select: none;
        }
        input, textarea {
            user-select: auto;
            -webkit-user-select: auto;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0) scale(1.25); }
            50% { transform: translateY(-10px) scale(1.25); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s ease-in-out infinite;
        }

        @keyframes slide-in-right-out-left {
            0% { transform: translateX(100%); opacity: 0; }
            10% { transform: translateX(0); opacity: 1; }
            90% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }
        }
        .animate-slide-text {
            animation: slide-in-right-out-left 3s linear infinite;
        }
    </style>
